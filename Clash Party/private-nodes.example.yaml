# Private nodes for SCKI's optional AI-only group.
#
# Copy this file to private-nodes.yaml, add your real nodes, and import the
# private-nodes.yaml file as a separate YAML override before enabling the JS
# override. The real file is ignored by Git and must never be published.
#
# The marker group is consumed by the JS and removed from the final config.
# Its members must exactly match names under `proxies`.

proxies: []

proxy-groups:
  - name: __SCKI_PRIVATE_AI__
    type: select
    proxies: []

