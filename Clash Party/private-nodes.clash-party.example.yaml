# Clash Party YAML override for SCKI private AI nodes.
#
# HOW TO USE:
# 1. Copy this file to private-nodes.yaml in this directory
# 2. Replace every REPLACE-ME placeholder with your real node details
# 3. In Clash Party: add private-nodes.yaml as a YAML override BEFORE the JS override
#    YAML overrides are applied first, then JS runs on the merged config.
# 4. private-nodes.yaml is gitignored — never commit it to a public repo
#
# SYNTAX NOTES:
#   +proxies      — prepends to subscription proxies (must use +, or subscription nodes get deleted)
#   +proxy-groups — prepends to subscription proxy-groups
#   Using plain "proxies:" or "proxy-groups:" would REPLACE the entire arrays,
#   deleting subscription nodes and JS-generated strategy groups.
#   See: https://clashparty.org/docs/guide/override/yaml
#
# ARCHITECTURE:
#   Clash Party applies YAML overrides BEFORE JS execution.
#   The JS collects node names from __SCKI_PRIVATE_AI__, validates them against
#   config.proxies, injects the private nodes into AI/Gemini strategy groups,
#   creates the AI专属 url-test/smart group, then removes the marker group.
#   Private nodes do NOT appear in 🌍 全球节点 or any regional group.
#
# NODE PROTOCOL NOTES:
#   - VLESS + REALITY is the recommended anti-censorship protocol
#   - Remove reality-opts if not using REALITY
#   - Remove flow if your server doesn't support XTLS
#   - Change type for other protocols: trojan, vmess, ss, hysteria2, etc.
#   - Add more nodes by appending entries to +proxies and listing their names
#     in the __SCKI_PRIVATE_AI__ proxies list

+proxies:
  - name: "REPLACE-ME-node-name-1"
    type: vless
    server: "REPLACE-ME.example.com"
    port: 443
    uuid: "REPLACE-ME-uuid"
    network: tcp
    tls: true
    udp: true
    servername: "REPLACE-ME-sni.example.com"
    client-fingerprint: chrome
    # flow: xtls-rprx-vision          # uncomment if your server supports XTLS
    # reality-opts:                    # uncomment if using REALITY
    #   public-key: "REPLACE-ME-public-key"
    #   short-id: "REPLACE-ME-short-id"

  # Add more nodes here. Example for a second node (different protocol):
  # - name: "REPLACE-ME-node-name-2"
  #   type: trojan
  #   server: "REPLACE-ME-2.example.com"
  #   port: 443
  #   password: "REPLACE-ME-password"
  #   network: tcp
  #   tls: true
  #   udp: true
  #   sni: "REPLACE-ME-sni-2.example.com"
  #   client-fingerprint: chrome

+proxy-groups:
  - name: __SCKI_PRIVATE_AI__
    type: select
    proxies:
      - "REPLACE-ME-node-name-1"
      # - "REPLACE-ME-node-name-2"