# ============================================================
# SCKI Private AI Nodes — FlClash merge snippet
# ============================================================
#
# This is a standard Mihomo YAML fragment (NOT a Clash Party override).
# FlClash does NOT have a YAML override system with +key merge operators.
# You must merge these entries into your subscription profile BEFORE
# FlClash loads it.
#
# FlClash pipeline: Read Profile → JS main(config) → App patch → Core
# Your private nodes must already be in config.proxies when JS runs.
# The JS discovers node names via __SCKI_PRIVATE_AI__, injects them into
# 🤖 AI 服务 strategy groups, creates the AI专属 url-test group, then
# removes the marker group. Private nodes do NOT appear in regional groups.
#
# HOW TO USE (choose ONE method):
#
#   Method A — Sub-Store combine (recommended):
#     1. In Sub-Store, create a "组合订阅" (combined subscription)
#     2. Add your airport subscription as source #1
#     3. Add this file's content as source #2 (upload or paste; select
#        Clash.Meta format)
#     4. Output format: Clash.Meta (mihomo)
#     5. Use the combined URL as your FlClash profile
#
#   Method B — Manual merge:
#     1. Get your subscription YAML content (not the URL)
#     2. Copy the proxies and proxy-groups from this file
#     3. Paste them into your subscription under the existing
#        proxies: and proxy-groups: keys
#     4. Import the merged file into FlClash as a local profile
#
#   Method C — FlClash profile stacking (if supported by your version):
#     1. Save this file as a local YAML file
#     2. In FlClash, add it as a second profile alongside your subscription
#     3. FlClash may merge profiles before JS execution (verify in your version)
#
# CRITICAL: This file uses standard Mihomo YAML (proxies: / proxy-groups:).
# Do NOT use +proxies or +proxy-groups — those are Clash Party-specific
# and will not work in FlClash.
#
# private-nodes.yaml (your real file with credentials) is gitignored.
# NEVER commit it or upload it to GitHub, Issue, or jsDelivr.

proxies:
  - name: "REPLACE-ME-node-name-1"
    type: vless
    server: "REPLACE-ME.example.com"
    port: 443
    uuid: "REPLACE-ME-uuid"
    network: tcp
    tls: true
    udp: true
    servername: "REPLACE-ME-sni.example.com"
    client-fingerprint: chrome
    # flow: xtls-rprx-vision          # uncomment if server supports XTLS
    # reality-opts:                    # uncomment if using REALITY
    #   public-key: "REPLACE-ME-public-key"
    #   short-id: "REPLACE-ME-short-id"

  # Add more nodes here:
  # - name: "REPLACE-ME-node-name-2"
  #   type: trojan
  #   server: "REPLACE-ME-2.example.com"
  #   port: 443
  #   password: "REPLACE-ME-password"
  #   network: tcp
  #   tls: true
  #   udp: true
  #   sni: "REPLACE-ME-sni-2.example.com"
  #   client-fingerprint: chrome

proxy-groups:
  - name: __SCKI_PRIVATE_AI__
    type: select
    proxies:
      - "REPLACE-ME-node-name-1"
      # - "REPLACE-ME-node-name-2"